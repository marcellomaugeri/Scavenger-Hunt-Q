<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" fill="none">
<title>Scavenger Hunt Q</title>
<desc>Retro game logo with custom outlined lettering and continuous red depth. The magnifying-glass Q is built from separate editable circles and rounded rectangles, organised into Glass, Handle and Q-depth groups. Transparent square canvas; equal nominal cap height for both word rows.</desc>
